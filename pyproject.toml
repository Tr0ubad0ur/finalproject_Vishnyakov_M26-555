[project]
name = "finalproject-vishnyakov-m26-555"
version = "0.1.0"
description = "ValutaTrade Hub: платформа отслеживания и симуляции торговли валютами"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[project.scripts]
project = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]